name: Compilar APK de Android

on:
  push:
    branches: [ "main", "principal", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar aplicación React (Vite)
        run: npm run build

      - name: Inicializar e Integrar Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
          fi

      - name: Compilar APK de Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: BTPlayer-APK-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
